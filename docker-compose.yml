services:
  cdnmap-automation:
    build: .
    image: cdnmap-prod
    container_name: cdnmap_prod
    restart: always
    network_mode: "host"
    environment:
      - MIKROTIK_IP=${MIKROTIK_IP}
      - MIKROTIK_USER=${MIKROTIK_USER}
      - ITERATIONS=5
      - DELAY=5
      - RUN_INTERVAL=21600
    volumes:
      - /root/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      - ./targets.json:/app/targets.json:ro
      - ./.env:/app/.env:ro